name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Backend ----
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build backend
        run: dotnet build

      - name: Test backend
        run: dotnet test

      # ---- Frontend ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: DotnetTemplate.Web
        run: npm ci

      - name: Build frontend
        working-directory: DotnetTemplate.Web
        run: npm run build

      # ---- Run app locally (CI-safe) ----
      - name: Run app in background
        working-directory: DotnetTemplate.Web
        run: |
          nohup dotnet run --urls "http://127.0.0.1:5000" > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ > /dev/null; then
              echo "✅ App is running"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 1
          done

          echo "❌ App failed to start"
          cat DotnetTemplate.Web/app.log
          exit 1

      - name: Stop app
        if: always()
        run: |
          kill $(cat DotnetTemplate.Web/app.pid) || true
