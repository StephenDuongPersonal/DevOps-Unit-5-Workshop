name: Continuous Integration

on: [push]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Build C# code
      - name: Build C#
        run: dotnet build

      # 4. Run C# tests
      - name: Test C#
        run: dotnet test

      # 5. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 6. Install TypeScript dependencies
      - name: Install TypeScript dependencies
        run: npm install

      # 7. Build TypeScript
      - name: Build TypeScript
        run: npm run build

      # 8. Run TypeScript linter
      - name: Lint TypeScript
        run: npm run lint

      # 9. Run TypeScript tests
      - name: Test TypeScript
        run: npm test
